<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; width: 280px; padding: 16px; }
    .card { background: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .status { display: flex; justify-content: space-between; font-size: 13px; }
    .btn { width: 100%; background: #3b82f6; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h3>DeepSeek Api Agent</h3>
  <div class="card">
    <div class="status"><span>Backend:</span><strong id="conn-status">Disconnected</strong></div>
    <div class="status"><span>Token Cached:</span><strong id="token-status">No</strong></div>
  </div>
  <button class="btn" id="sync-btn">Force Sync DeepSeek Session</button>
  <script src="popup.js"></script>
</body>
</html>
